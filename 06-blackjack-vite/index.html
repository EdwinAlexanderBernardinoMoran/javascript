<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  </head>
  <body>
    <header class="title">
      Blackjack
    </header>
    
    <div class="row mt-2">
      <div id="buttons" class="col text-center">
        <button id="btn-new-game" class="btn btn-danger">New Game</button>
        <button id="btn-ask-letter" disabled class="btn btn-primary">Ask letter</button>
        <button id="btn-stop" disabled class="btn btn-primary">Stop</button>
      </div>
    </div>
    
    <div class="row container">
      <div class="col">
        <h1>Player 1 - <small>0</small></h1>
        <div id="card-player" class="cards">
          <!-- <img class="card-player" src="assets/cards/2D.png" alt=""> -->
        </div>
      </div>
    </div>
    
    
    <div class="row container mt-2">
      <div class="col">
        <h1>Computer 4 - <small>0</small></h1>
        <div id="card-computer" class="cards">
          <!-- <img class="card-player" src="assets/cards/2D.png" alt=""> -->
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
